title: Skewer Hello World
subtitle: A minimal HTTP application deployed and a configuration created
workflow: 
overview: |
  In this example, we see how you create contexts (sites) and run commands.
  In the Server context (site), we delete the index.html file and run a 
  web server. In the Config context (site), we convert md to html and wait
  until user has tested the result on the web server.
prerequisites: |
  * npm  
    ```
    brew install node
    https://github.com/nvm-sh/nvm
    ```
  * python
    ```
    pip install pyyaml
    ```

sites:
  server:
    title: Server
    platform: podman
    namespace: server
    env:
      SKUPPER_PLATFORM: podman
  config:
    title: Config
    platform: podman
    namespace: config
    env:
      SKUPPER_PLATFORM: podman
steps:

  - title: Start the HTTP web server without an `index.html` file
    commands:
      server:
        - run: "rm -f index.html"
        - run: "npm_config_yes=true npx  http-server -s -p 4567 . &"
  - title: Create an `index.html` file
    commands:
      config:
        - run: "npm_config_yes=true npx  markdown-to-html-cli --source index.md"
        - run: "read -p 'Navigate to http://localhost:4567 and then press enter to exit.' input "
        - run: "kill $(ps aux | grep '[e]xec http-server' | awk '{print $2}')"

summary: |
  @default@

  More summary
next_steps: |
  @default@

  More steps
