# Example extension file for extending a running demo
#
# Usage:
#   Terminal 1: ./plano demo
#   Terminal 2: ./plano demo_extend examples/cli/skewer-extend.yaml

title: Skupper Network Observer Extension
subtitle: Add observability and console access to a running Skupper demo
overview: |
  This extension adds the Skupper Network Observer to your running demo,
  providing a web console for monitoring and managing your Skupper network.
  The Network Observer offers real-time visibility into service connectivity,
  traffic flows, and network topology across your multi-cluster deployment.

steps:


  - title: Check Skupper site status
    commands:
      west:
        - run: skupper site status
      east:
        - run: skupper site status


  - title: Install Skupper Network Observer and expose the console
    commands:
      west:
        - run: helm install skupper-network-observer oci://quay.io/skupper/helm/network-observer --version 2.2.0
        - run: oc create route passthrough skupper-console --service=skupper-network-observer --port=https
        - run: kubectl get secret skupper-network-observer-auth -o jsonpath='{.data.htpasswd}' | base64 -d | sed 's/\(.*\):{PLAIN}\(.*\)/\1 \2\n/'
        - run: skupper link generate > ~/link.yaml

